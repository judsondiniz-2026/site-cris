# Publica o site no Hostinger (public_html) a cada envio para a branch main.
# Segredos necessários (GitHub > Settings > Secrets and variables > Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD e, se a pasta do FTP não for a public_html, FTP_DIR.
name: Publicar no Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar arquivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_DIR || '/public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            docs/**
            README.md
